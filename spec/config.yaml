# yaml-language-server: $schema=schemas/config.schema.json
#
# proctop spec — single source of truth for user-facing text, colors, keys,
# output templates, and defaults. Go code must not duplicate these values.

app:
  name: proctop
  title: "proctop — {{.Target}} (pid {{.RootPID}}, {{.Procs}} procs)"

defaults:
  interval: 1s
  # [+]/[-] walk this ascending ladder of sampling intervals; an off-ladder
  # start value (--interval) snaps to the next step in the pressed direction
  interval_steps: [100ms, 200ms, 500ms, 1s, 2s, 5s, 10s, 30s, 1m]
  history: 300
  graph_height: 5
  format: color

keys:
  quit: ["q", "Q", "<c-c>", "<esc>"]
  pause: ["p", "P", "<space>"]
  screenshot: ["s", "S"]
  interval_up: ["+"]
  interval_down: ["-"]
  # pause-mode annotation keys
  cursor_left: ["<left>", "h"]
  cursor_right: ["<right>", "l"]
  mark: ["v"]
  annotate: ["a"]

# 256-color ANSI palette indices per semantic token.
# cursor/select/annot are background colors for graph column highlights.
theme:
  cpu: 214
  mem: 39
  label: 252
  dim: 244
  max: 203
  min: 78
  title: 255
  cursor: 252
  select: 240
  annot: 24
  label_bg: 237
  connector: 255

graph:
  levels: " ▁▂▃▄▅▆▇█"
  # marker placed at an annotated column when label_cap is none
  marker: "▼"
  # max rune length of in-graph labels (longer notes are truncated with …)
  label_width: 24
  # floating label style: [Test]──▶ pointing at the annotated column
  label_box: brackets # brackets | box (3-row box art, falls back to brackets) | none
  label_cap: arrow    # none (use marker) | simple (> <) | arrow (▶ ◀)
  label_line: border  # none | border (──) | minus (--)

labels:
  cpu: "CPU"
  mem: "MEM"
  procs: "procs"
  min: "min"
  max: "max"
  avg: "avg"
  elapsed: "elapsed"
  interval: "interval"
  hint_quit: "[q] quit"
  hint_pause: "[p] pause/play"
  hint_screenshot: "[s] screenshot"
  hint_annotate: "[←→] move  [v] mark  [a] note"
  hint_scroll: "[←→] scroll"
  hint_interval: "[+-] interval"
  hint_note: "[enter] save · [esc] cancel"
  note_prompt: "note:"
  paused: "⏸ paused (still recording)"
  scrolled: "⏪ history"
  saved: "📷 saved"
  waiting: "sampling…"

formats:
  # Per-sample line templates. Fields: .Time .CPU .Mem .Procs
  # {{fg "token"}} emits the ANSI color for a theme token, {{off}} resets.
  plain: "{{.Time}} cpu={{.CPU}}% mem={{.Mem}} procs={{.Procs}}"
  color: '{{fg "dim"}}{{.Time}}{{off}} cpu={{fg "cpu"}}{{.CPU}}%{{off}} mem={{fg "mem"}}{{.Mem}}{{off}} procs={{.Procs}}'
  time: "2006-01-02T15:04:05"
  # TUI pause-mode lines; fields: .Time .Span .CPU .Mem (.Note for annotation)
  cursor: "▶ {{.Time}} cpu {{.CPU}}% mem {{.Mem}}"
  annotation: "● {{.Time}}{{.Span}} cpu {{.CPU}}% mem {{.Mem}} — {{.Note}}"

screenshot:
  # Filename template (no extension); fields: .Target .Time
  name: "proctop-{{.Target}}-{{.Time}}"
  # Go time layout for .Time — must be filename-safe (no colons)
  time: "20060102-150405"
  # Written formats: txt = colors stripped, ansi = raw escapes (view: cat)
  formats: ["txt", "ansi"]

summary:
  # Human-readable summary printed on exit.
  # Fields: .Target .RootPID .Start .End .Elapsed .Samples
  #         .CPUMax .CPUMaxTime .CPUMin .CPUAvg
  #         .MemMax .MemMaxTime .MemMin .MemAvg
  text: |
    proctop summary — {{.Target}} (pid {{.RootPID}})
      window   {{.Start}} … {{.End}} ({{.Elapsed}}, {{.Samples}} samples)
      cpu      max {{.CPUMax}}% @ {{.CPUMaxTime}} · min {{.CPUMin}}% · avg {{.CPUAvg}}%
      mem      max {{.MemMax}} @ {{.MemMaxTime}} · min {{.MemMin}} · avg {{.MemAvg}}
