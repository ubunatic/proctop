title: proctop — whole-process-tree monitor
kicker: Linux process monitor
title_lead: proctop
title_main: watches a whole process tree.
lead: >-
  proctop watches one process and its descendants and records CPU and memory over time. Follow a
  live TUI graph or stream plain, colored, or JSON samples; peaks and a summary are tracked on exit.
logo:
  src: logo.svg
  alt: proctop logo
install: go install codeberg.org/ubunatic/proctop@latest
cta_primary:
  label: Install
  href: "#install"
cta_secondary:
  label: Browse the source
  href: https://codeberg.org/ubunatic/proctop

